<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Canadian landscape">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E8F4F8"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#009f6b"/>
      <stop offset="100%" stop-color="#007a52"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1a3d32"/>
      <stop offset="100%" stop-color="#4a6b5e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <ellipse cx="400" cy="520" rx="420" ry="80" fill="url(#lake)" opacity="0.9"/>
  <polygon points="0,420 120,280 220,350 340,200 480,320 600,180 720,300 800,250 800,600 0,600" fill="url(#mtn)"/>
  <polygon points="280,380 400,240 520,380" fill="#2d5a4a" opacity="0.7"/>
  <circle cx="650" cy="100" r="45" fill="#FFE082" opacity="0.9"/>
  <text x="400" y="560" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="white" opacity="0.8">Your journey to Canada</text>
</svg>
